Backend uses Spring Boot, Apache Maven( Built automation and project management tool used for Java projects to handle compilation, testing, and packaging)-JAVA frameworks 

Scaffolding a Spring Boot backend with security and auth.






Application.yml
spring:
  application:
    name: sift-screener

  # Default profile uses an in-memory H2 database so the project runs with
  # zero setup. Switch to the "postgres" profile (see below) for real use.
  datasource:
    url: jdbc:h2:mem:sift;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6
          temperature: 0.2

jwt:
  # Override in production via env var. Must be a long, random, base64-safe string.
  secret: ${JWT_SECRET:change-this-dev-only-secret-please-please-please-change-me}
  expiration-ms: 86400000 # 24h

server:
  port: 8080

logging:
  level:
    com.sift.screener: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sift}
    username: ${DB_USER:sift}
    password: ${DB_PASSWORD:sift}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect



